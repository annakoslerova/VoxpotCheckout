# Nasazení archivu na GitHub Pages přes Actions.
#
# Původně se používalo "deploy from a branch", jenže to při každém pushi
# přestavuje a nasazuje celý web. Archiv má přes 3600 souborů (449 stránek čísel
# a 3137 zrcadlených obrázků), takže build začal trvat desítky minut a nakonec
# padat — 6. 8. 2026 kvůli tomu nevyšel newsletter včas.
#
# Tahle cesta balí docs/ do artefaktu a nasazuje ho přímo, bez Jekyllu.
name: Deploy archive to Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nechat doběhnout nasazení, které už běží — nikdy ho nerušit uprostřed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
